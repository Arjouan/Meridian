# Local development infrastructure.
# Docker Compose automatically reads variables from the .env file in this folder.
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (WARNING: deletes database data)

services:
  db:
    # PostGIS-enabled PostgreSQL. TimescaleDB and pgRouting are introduced in later
    # phases (see docs/ARCHITECTURE.md) via an image swap / extension install.
    image: postgis/postgis:16-3.4
    container_name: mlp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-maritime}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-maritime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mlp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
